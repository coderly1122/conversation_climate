<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Climate – Live Voice Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ef 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .back-home {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 20px;
            background: white;
            color: #1D9E75;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 500;
        }
        .auth-section, .analysis-card {
            background: white;
            border-radius: 28px;
            padding: 32px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .auth-title { font-size: 24px; font-weight: 600; margin-bottom: 20px; }
        .auth-form { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .auth-input-group { flex: 1; min-width: 150px; }
        .auth-input-group label { display: block; font-size: 12px; font-weight: 600; color: #666; margin-bottom: 5px; }
        .auth-input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; }
        .auth-btn { background: #1D9E75; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .switch-auth { margin-top: 15px; text-align: center; color: #1D9E75; cursor: pointer; }
        .user-info { background: #f0faf6; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: #e63946; color: white; border: none; padding: 6px 16px; border-radius: 20px; cursor: pointer; }
        .button-group { display: flex; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .btn-start { background: linear-gradient(135deg, #1D9E75, #0e6e52); color: white; border: none; padding: 12px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-stop { background: white; color: #e63946; border: 2px solid #e63946; padding: 12px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-save { background: #185FA5; color: white; border: none; padding: 12px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-pdf { background: #e67e22; color: white; border: none; padding: 12px 28px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 20px 0; }
        .stat-card { background: #f7f9fc; border: 1px solid #e4e8ef; border-radius: 16px; padding: 16px; text-align: center; }
        .stat-value { font-size: 32px; font-weight: 700; color: #1D9E75; font-family: monospace; }
        .stat-label { font-size: 11px; color: #666; margin-top: 5px; }
        .volume-track { height: 8px; background: #e0e0e0; border-radius: 10px; overflow: hidden; margin: 20px 0; }
        .volume-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #1D9E75, #185FA5); transition: width 0.07s; }
        .live-badge { display: inline-flex; align-items: center; gap: 8px; background: #f0faf6; padding: 6px 16px; border-radius: 40px; margin-bottom: 20px; }
        .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .live-dot.active { background: #1D9E75; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .status-row { margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; color: #666; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; margin-top: 10px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-home">← Back to Home</a>

        <!-- Login/Signup Section -->
        <div class="auth-section" id="authSection">
            <div class="auth-title" id="authTitle">Login</div>
            <div class="auth-form">
                <div class="auth-input-group" id="nameGroup" style="display: none;">
                    <label>Name</label>
                    <input type="text" id="signupName" placeholder="Your name">
                </div>
                <div class="auth-input-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" placeholder="email@example.com">
                </div>
                <div class="auth-input-group">
                    <label>Password</label>
                    <input type="password" id="authPassword" placeholder="••••••">
                </div>
                <button class="auth-btn" id="authSubmitBtn">Login</button>
            </div>
            <div class="switch-auth" id="switchAuth">Don't have an account? Sign up</div>
        </div>

        <!-- User Info -->
        <div class="user-info" id="userInfo" style="display: none;">
            <span>👋 Welcome, <span id="userNameDisplay"></span></span>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <!-- Analysis Card -->
        <div class="analysis-card" id="analysisCard" style="display: none;">
            <div class="live-badge">
                <div class="live-dot" id="liveDot"></div>
                <span id="liveLabel">Offline</span>
            </div>

            <h2>🎤 Live Voice Analysis</h2>
            <p>Real-time speaking patterns, interruptions, and tone detection</p>

            <div class="button-group">
                <button class="btn-start" id="startBtn">▶ Start Microphone</button>
                <button class="btn-stop" id="stopBtn" disabled>■ Stop Session</button>
                <button class="btn-save" id="saveReportBtn" disabled>💾 Save to Cloud</button>
                <button class="btn-pdf" id="downloadPdfBtn" disabled>📄 Download PDF</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card"><div class="stat-value" id="speakingTime">0</div><div class="stat-label">Speaking (sec)</div></div>
                <div class="stat-card"><div class="stat-value" id="interruptionCount">0</div><div class="stat-label">Interruptions</div></div>
                <div class="stat-card"><div class="stat-value" id="volumeValue">0</div><div class="stat-label">Volume (%)</div></div>
                <div class="stat-card"><div class="stat-value" id="pitchValue">—</div><div class="stat-label">Frequency</div></div>
            </div>

            <div class="volume-track"><div class="volume-fill" id="volumeFill"></div></div>

            <div class="status-row">Status: <span id="statusText">Awaiting input</span></div>
            
            <pre id="debugLog">Ready. Login to start.</pre>
        </div>
    </div>

    <script>
        // ============================================
        // WORKING VERSION - CONNECTS TO BACKEND WITH PDF
        // ============================================
        
        const BACKEND_URL = 'http://localhost:3000';
        
        // Auth state
        let authToken = null;
        let currentUser = null;
        let isLoginMode = true;
        
        // Audio state
        let mediaStream = null;
        let audioContext = null;
        let analyser = null;
        let animationId = null;
        let isRecording = false;
        let isSpeaking = false;
        let speakingSeconds = 0;
        let intervalId = null;
        let interruptionCount = 0;
        let lastVolume = 0;
        
        // DOM elements
        const authSection = document.getElementById('authSection');
        const authTitle = document.getElementById('authTitle');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const signupName = document.getElementById('signupName');
        const nameGroup = document.getElementById('nameGroup');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const switchAuth = document.getElementById('switchAuth');
        const userInfo = document.getElementById('userInfo');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const analysisCard = document.getElementById('analysisCard');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const saveReportBtn = document.getElementById('saveReportBtn');
        const downloadPdfBtn = document.getElementById('downloadPdfBtn');
        const speakingTimeSpan = document.getElementById('speakingTime');
        const interruptionSpan = document.getElementById('interruptionCount');
        const volumeValueSpan = document.getElementById('volumeValue');
        const volumeFill = document.getElementById('volumeFill');
        const statusText = document.getElementById('statusText');
        const liveDot = document.getElementById('liveDot');
        const liveLabel = document.getElementById('liveLabel');
        const debugLog = document.getElementById('debugLog');
        
        function log(msg) {
            if (debugLog) debugLog.innerText = msg + '\n' + debugLog.innerText.slice(0, 500);
            console.log(msg);
        }
        
        // ========== PDF DOWNLOAD FUNCTION ==========
        async function downloadPDF() {
            if (!authToken) {
                alert('Please login first');
                return;
            }
            
            try {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                // Title
                doc.setFontSize(22);
                doc.setTextColor(30, 42, 94);
                doc.text("Conversation Climate - Meeting Report", 20, 20);
                
                // Date
                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text(`Generated: ${new Date().toLocaleString()}`, 20, 30);
                doc.text(`User: ${currentUser?.name || 'Guest'}`, 20, 37);
                
                // Divider
                doc.line(20, 42, 190, 42);
                
                // Session Stats
                doc.setFontSize(14);
                doc.setTextColor(30, 42, 94);
                doc.text("Session Statistics", 20, 55);
                
                doc.setFontSize(12);
                doc.setTextColor(0, 0, 0);
                doc.text(`Total Speaking Time: ${speakingSeconds} seconds`, 20, 68);
                doc.text(`Interruptions Detected: ${interruptionCount}`, 20, 78);
                doc.text(`Session Status: Completed`, 20, 88);
                
                // Divider
                doc.line(20, 95, 190, 95);
                
                // Footer
                doc.setFontSize(9);
                doc.setTextColor(150, 150, 150);
                doc.text("Conversation Climate - Privacy First, No Cloud Storage", 20, 280);
                doc.text(`Report ID: ${Date.now()}`, 20, 270);
                
                // Save PDF
                doc.save(`meeting_report_${Date.now()}.pdf`);
                
                alert('✅ PDF downloaded!');
                log('PDF downloaded successfully');
            } catch (error) {
                log(`❌ PDF error: ${error.message}`);
                alert('Error generating PDF: ' + error.message);
            }
        }
        
        // ========== AUTH FUNCTIONS ==========
        function switchMode() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authTitle.innerText = 'Login';
                authSubmitBtn.innerText = 'Login';
                switchAuth.innerText = "Don't have an account? Sign up";
                nameGroup.style.display = 'none';
            } else {
                authTitle.innerText = 'Sign Up';
                authSubmitBtn.innerText = 'Sign Up';
                switchAuth.innerText = 'Already have an account? Login';
                nameGroup.style.display = 'block';
            }
        }
        
        async function handleAuth() {
            const email = authEmail.value.trim();
            const password = authPassword.value.trim();
            
            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }
            
            if (!isLoginMode) {
                const name = signupName.value.trim();
                if (!name) {
                    alert('Please enter your name');
                    return;
                }
            }
            
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/signup';
            const body = isLoginMode 
                ? { email, password }
                : { name: signupName.value.trim(), email, password };
            
            log(`Sending ${endpoint} request...`);
            
            try {
                const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                
                const data = await response.json();
                log(`Response: ${JSON.stringify(data, null, 2)}`);
                
                if (!response.ok) {
                    alert(data.error || 'Authentication failed');
                    return;
                }
                
                authToken = data.token;
                currentUser = { id: data.userId, name: data.name };
                
                authSection.style.display = 'none';
                userInfo.style.display = 'flex';
                analysisCard.style.display = 'block';
                userNameDisplay.innerText = data.name;
                statusText.innerText = 'Logged in. Ready to start.';
                log('✅ Login successful!');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`);
                alert('Connection error: ' + error.message + '\nMake sure backend is running on port 3000');
            }
        }
        
        function logout() {
            authToken = null;
            currentUser = null;
            stopMicrophone();
            authSection.style.display = 'block';
            userInfo.style.display = 'none';
            analysisCard.style.display = 'none';
            authEmail.value = '';
            authPassword.value = '';
            if (signupName) signupName.value = '';
            log('Logged out');
        }
        
        // ========== SAVE REPORT ==========
        async function saveReport() {
            if (!authToken) {
                alert('Please login first');
                return;
            }
            
            const reportData = {
                speakingTime: speakingSeconds,
                interruptionCount: interruptionCount,
                sessionDuration: speakingSeconds,
                interruptionLog: []
            };
            
            log('Saving report...');
            
            try {
                const response = await fetch(`${BACKEND_URL}/api/meetings/save`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(reportData)
                });
                
                const data = await response.json();
                log(`Save response: ${JSON.stringify(data, null, 2)}`);
                
                if (response.ok) {
                    alert(`✅ Report saved to Cloud!\nSpeaking: ${speakingSeconds}s\nInterruptions: ${interruptionCount}`);
                } else {
                    alert('Error: ' + (data.error || 'Failed to save'));
                }
            } catch (error) {
                log(`❌ Save error: ${error.message}`);
                alert('Error saving report: ' + error.message);
            }
        }
        
        // ========== AUDIO FUNCTIONS ==========
        function calculateVolume(dataArray) {
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) {
                const v = (dataArray[i] - 128) / 128;
                sum += v * v;
            }
            const rms = Math.sqrt(sum / dataArray.length);
            return Math.min(100, Math.floor(rms * 100 * 2));
        }
        
        function processAudio() {
            if (!isRecording || !analyser) return;
            
            const dataArray = new Uint8Array(analyser.fftSize);
            analyser.getByteTimeDomainData(dataArray);
            
            const volume = calculateVolume(dataArray);
            const isCurrentlySpeaking = volume > 5;
            
            // Speaking state
            if (isCurrentlySpeaking && !isSpeaking && isRecording) {
                isSpeaking = true;
                liveDot.classList.add('active');
                liveLabel.innerText = 'Speaking';
                statusText.innerText = '🔊 Speaking';
            } else if (!isCurrentlySpeaking && isSpeaking && isRecording) {
                isSpeaking = false;
                liveDot.classList.remove('active');
                liveLabel.innerText = 'Listening';
                statusText.innerText = '🎤 Listening';
            }
            
            // Interruption detection
            if (isRecording && isSpeaking) {
                const volumeJump = volume - lastVolume;
                if (volumeJump > 15 && volume > 20) {
                    interruptionCount++;
                    interruptionSpan.innerText = interruptionCount;
                    log(`🔔 Interruption detected! Count: ${interruptionCount}`);
                }
            }
            lastVolume = volume;
            
            // Update displays
            volumeValueSpan.innerText = volume;
            volumeFill.style.width = volume + '%';
            
            requestAnimationFrame(processAudio);
        }
        
        async function startMicrophone() {
            if (isRecording) return;
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaStream = stream;
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                await audioContext.resume();
                
                isRecording = true;
                isSpeaking = false;
                speakingSeconds = 0;
                interruptionCount = 0;
                lastVolume = 0;
                
                speakingTimeSpan.innerText = '0';
                interruptionSpan.innerText = '0';
                
                if (intervalId) clearInterval(intervalId);
                intervalId = setInterval(() => {
                    if (isRecording && isSpeaking) {
                        speakingSeconds++;
                        speakingTimeSpan.innerText = speakingSeconds;
                    }
                }, 1000);
                
                processAudio();
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                saveReportBtn.disabled = false;
                if (downloadPdfBtn) downloadPdfBtn.disabled = true;
                liveDot.classList.add('active');
                liveLabel.innerText = 'Recording';
                statusText.innerText = '🎙️ Recording...';
                log('✅ Microphone started');
                
            } catch (error) {
                log(`❌ Microphone error: ${error.message}`);
                alert('Microphone error: ' + error.message);
            }
        }
        
        function stopMicrophone() {
            isRecording = false;
            isSpeaking = false;
            
            if (intervalId) { clearInterval(intervalId); intervalId = null; }
            if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            
            startBtn.disabled = false;
            stopBtn.disabled = true;
            if (downloadPdfBtn) downloadPdfBtn.disabled = false;
            liveDot.classList.remove('active');
            liveLabel.innerText = 'Offline';
            statusText.innerText = `Stopped. ${speakingSeconds}s, ${interruptionCount} interruptions`;
            log('✅ Microphone stopped');
        }
        
        // ========== EVENT LISTENERS ==========
        switchAuth.addEventListener('click', switchMode);
        authSubmitBtn.addEventListener('click', handleAuth);
        logoutBtn.addEventListener('click', logout);
        startBtn.addEventListener('click', startMicrophone);
        stopBtn.addEventListener('click', stopMicrophone);
        saveReportBtn.addEventListener('click', saveReport);
        if (downloadPdfBtn) downloadPdfBtn.addEventListener('click', downloadPDF);
        
        log('App loaded. Ready to login.');
    </script>
</body>
</html>
