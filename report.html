<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Report</title>

  <link rel="stylesheet" href="landing-style.css">
  <link rel="stylesheet" href="report.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="landing-page.html" class="brand">
      <div class="logo-box">🌡</div>
      Conversation Climate
    </a>
    <div class="nav-right">
      <button class="btn-outline"
        onclick="window.location.href='landing-page.html'">
        ← Back
      </button>
    </div>
  </nav>

  <!-- REPORT PAGE -->
  <main class="report-page">

    <div class="report-header">
      <h2>Meeting Report</h2>
     <!--automatic aaj ki date aayegi -->
     <p class="report-date" id="reportDate">📅</p>
    </div>

    <!-- TONE CHART CARD -->
    <div class="chart-card">
      <h3>🌡 Tone Trend</h3>
      <p>How mood changed during your meeting</p>

      <!-- Yahan chart ayega -->
      <canvas id="toneChart"></canvas>

      <!-- Tone labels -->
      <div class="tone-labels">
        <span class="tone-calm">😊 Calm</span>
        <span class="tone-mid">😐 Neutral</span>
        <span class="tone-tense">😤 Tense</span>
      </div>
    </div>

    <!-- VOLUME CARD -->
    <div class="chart-card" style="margin-top: 20px;">
      <h3>🔊 Volume Trend</h3>
      <p>How loud the meeting was over time</p>
      <canvas id="volumeChart"></canvas>
    </div>

  </main>

  <!-- Pehle Zakia ka file -->
  <script src="tone_detection.js"></script>
  <!-- Phir tumhara file -->
  <script src="report.js"></script>

</body>
</html>
