<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Report</title>
  <link rel="stylesheet" href="landing-style.css">
  <link rel="stylesheet" href="report.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="brand">
      <div class="logo-box">🌡</div>
      Conversation Climate
    </a>
    <div class="nav-right">
      <button class="btn-outline"
        onclick="window.location.href='index.html'">
        ← Back
      </button>
      <button class="btn-primary" id="pdfBtn">
  ⬇ Download PDF
</button>
    </div>
  </nav>


  <main class="report-page" id="report-main">

    <!-- Date -->
    <div class="report-header">
      <h2>Meeting Report</h2>
      <p class="report-date" id="reportDate">📅</p>
    </div>

    <!-- Stats cards -->
    <div class="report-stats">
      <div class="r-stat-card">
        <div class="r-stat-icon">🗣</div>
        <div class="r-stat-val" id="speakStat">0</div>
        <div class="r-stat-lbl">Speaking seconds</div>
      </div>
      <div class="r-stat-card">
        <div class="r-stat-icon">⚡</div>
        <div class="r-stat-val" id="intStat">0</div>
        <div class="r-stat-lbl">Interruptions</div>
      </div>
    </div>

    <!-- Tone Chart -->
    <div class="chart-card">
      <h3>🌡 Tone Trend</h3>
      <p>How mood changed during meeting</p>
      <canvas id="toneChart"></canvas>
      <div class="tone-labels">
        <span class="tone-calm">😊 Calm</span>
        <span class="tone-mid">😐 Neutral</span>
        <span class="tone-tense">😤 Tense</span>
      </div>
    </div>

    <!-- Volume Chart -->
    <div class="chart-card" style="margin-top:20px;">
      <h3>🔊 Volume Trend</h3>
      <p>How loud the meeting was</p>
      <canvas id="volumeChart"></canvas>
    </div>

    <!-- Interruption Table -->
    <div class="chart-card" style="margin-top:20px;">
      <h3>⚡ Interruption Log</h3>
      <p>Who interrupted whom</p>
      <table class="int-table">
        <thead>
          <tr>
            <th>Time</th>
            <th>Interrupter</th>
            <th>Interrupted</th>
            <th>Signal</th>
          </tr>
        </thead>
        <tbody id="intTableBody">
          <tr>
            <td colspan="4" style="text-align:center;color:#999;">
              No data yet
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="report.js"></script>
</body>
</html>
