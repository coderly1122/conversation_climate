<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Climate – Audio Test</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎤</text></svg>">
</head>
<body>
    <div class="container">
    <a href="index.html" class="back-link">← Back to Home</a>
    <h1>🎤 Voice Analyzer</h1>

<h1>Conversation Climate</h1>

<p>Click Start → Allow Microphone → Speak → Watch the meter light up</p>

<button id="startBtn">🎤 Start Session</button>
<button id="stopBtn" disabled>⏹️ Stop</button>

<div class="meter" id="meter">
    <span>🔴</span>
</div>

<div class="stats" id="stats">
    Speaking time: <span id="speakingTime">0</span> seconds<br>
    Status: <span id="status">Not started</span>
</div>



</body>
</html>
